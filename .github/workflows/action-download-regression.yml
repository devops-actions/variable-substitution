name: Action download regression

on:
  push:
    paths:
      - '.github/workflows/action-download-regression.yml'
      - 'scripts/action-download.test.mjs'
      - 'node_modules/**'
      - 'action.yml'
      - 'src/**'
      - 'lib/**'
  pull_request:
    paths:
      - '.github/workflows/action-download-regression.yml'
      - 'scripts/action-download.test.mjs'
      - 'node_modules/**'
      - 'action.yml'
      - 'src/**'
      - 'lib/**'
  workflow_dispatch:

permissions: {}

jobs:
  archive_integrity:
    name: Published tree integrity
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test scripts/action-download.test.mjs

  candidate:
    name: Current action (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    steps:
      - name: Enable long paths for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.symlinks false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path app/sub -Force | Out-Null
          '{"Logging":{"Level":"x"},"ConnectionStrings":{"Db":"old"}}' | Set-Content -Path app/sub/appsettings.json -Encoding utf8NoBOM
      - name: Run the checked-out action
        uses: ./
        with:
          files: 'app/**/appsettings*json'
        env:
          ConnectionStrings.Db: new
      - name: Assert substitution
        shell: pwsh
        run: |
          $actual = Get-Content -Raw app/sub/appsettings.json | ConvertFrom-Json
          if ($actual.ConnectionStrings.Db -cne 'new' -or $actual.Logging.Level -cne 'x') {
            throw 'Expected Db=new and unchanged Logging.Level=x'
          }
